# This file manages all that has to do with packages

modules:

  - type: bling
    install:
      - rpmfusion

  - type: akmods
    base: main
    install:
      - v4l2loopback

    nvidia-driver: nvidia-open

  - type: initramfs

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
      copr:
        - scottames/ghostty
    install:
      packages:
        - gnome-tweaks
        - stow
        - ghostty
        - btop
        - fuse-sshfs
        - steam
        - mangohud
        - wayland-utils

        # Dev Tools
        - python3-devel
        - android-tools
        - git-lfs
        - qemu

        # Container Tools
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-compose-plugin

        # Themes
        - adw-gtk3-theme

        # Deps
        - nautilus-python

    remove:
      auto-remove: true
      packages:
        - firefox
        - firefox-langpacks
        - gnome-shell-extension-background-logo
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-window-list
        - gnome-shell-extension-places-menu
        - ptyxis
        - nvtop
        - gnome-system-monitor
        - gnome-tour
        - dconf-editor
        - htop
        - gnome-extensions-app

  - type: systemd
    system:
      enabled:
        - docker.service
        - containerd.service
        - podman.service
      disabled:
        - flatpak-system-update.timer
        - rpm-ostreed-automatic.timer
        - NetworkManager-wait-online.service

    user:
      disabled:
        - flatpak-user-update.timer

  - type: brew
    brew-analytics: false
    auto-update: false
    auto-upgrade: false
    nofile-limits: false

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: user
        install:
          - org.gnome.Loupe
          - io.github.celluloid_player.Celluloid
          - com.mattjakeman.ExtensionManager
          - org.gnome.Calendar
          - com.github.tchx84.Flatseal
          - it.mijorus.gearlever
          - io.missioncenter.MissionCenter
          - org.kde.okular
