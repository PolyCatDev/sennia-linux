name: sennia-linux
description: uBlue imaged tweaked by PolyCat with nvidia drivers

base-image: ghcr.io/ublue-os/silverblue-main
image-version: 45

modules:
  
  - type: os-release
    properties:
      HOME_URL: https://github.com/PolyCatDev/sennia-linux
      BUG_REPORT_URL: https://github.com/PolyCatDev/sennia-linux/issues
      DEFAULT_HOSTNAME: fedora-sennia

  - type: script
    scripts:
      - remove-default-backgrounds.sh
      - generate-system-update-wrapper.sh

  - type: files
    files:
      - source: system
        destination: /

  - type: gschema-overrides
  - type: gnome-extensions
    install:
      - 615 # AppIndicator and KStatusNotifierItem Support
      - 517 # Caffeine
      - 3193 # Blur my Shell

  - from-file: pkgs.yml

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
